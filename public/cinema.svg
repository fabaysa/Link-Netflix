<svg width="540" height="360" viewBox="0 0 540 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Red Room 7s Cinematic Intro Animation Loop */
    @keyframes redRoomGlow {
      0%, 100% { opacity: 0.55; transform: scale(0.97); }
      25%, 70% { opacity: 0.95; transform: scale(1.02); }
    }
    @keyframes tudumBeamSweep {
      0% { opacity: 0; transform: scaleY(0.2) translateX(-35px); }
      12% { opacity: 0.85; transform: scaleY(1) translateX(0px); }
      28% { opacity: 0.5; transform: scaleY(1) translateX(15px); }
      45%, 85% { opacity: 0.16; transform: scaleY(1) translateX(25px); }
      100% { opacity: 0; transform: scaleY(0.4) translateX(35px); }
    }
    @keyframes logoNetflixReveal {
      0%, 8% { opacity: 0; transform: translateX(-22px) scale(0.85); filter: blur(3px); }
      20%, 75% { opacity: 1; transform: translateX(0px) scale(1); filter: blur(0px); }
      88%, 100% { opacity: 0; transform: translateX(-10px) scale(1.05); filter: blur(2px); }
    }
    @keyframes sparkCross {
      0%, 18% { opacity: 0; transform: scale(0) rotate(-90deg); }
      27% { opacity: 1; transform: scale(1.25) rotate(0deg); }
      34%, 75% { opacity: 1; transform: scale(1) rotate(0deg); }
      88%, 100% { opacity: 0; transform: scale(0.4) rotate(90deg); }
    }
    @keyframes shockwavePulse {
      0%, 22% { opacity: 0; transform: scale(0.2); }
      28% { opacity: 0.8; transform: scale(0.95); }
      45%, 100% { opacity: 0; transform: scale(2.2); }
    }
    @keyframes logoIlinkReveal {
      0%, 14% { opacity: 0; transform: translateX(22px) scale(0.85); filter: blur(3px); }
      25%, 75% { opacity: 1; transform: translateX(0px) scale(1); filter: blur(0px); }
      88%, 100% { opacity: 0; transform: translateX(10px) scale(1.05); filter: blur(2px); }
    }
    @keyframes scannerLaser {
      0%, 20% { stroke-dashoffset: 260; opacity: 0; }
      30% { opacity: 1; }
      70% { stroke-dashoffset: 0; opacity: 1; }
      85%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes subHeadlineReveal {
      0%, 26% { opacity: 0; transform: translateY(8px); }
      38%, 75% { opacity: 1; transform: translateY(0px); }
      88%, 100% { opacity: 0; transform: translateY(6px); }
    }

    .glow-pulse { transform-origin: 270px 150px; animation: redRoomGlow 7s ease-in-out infinite; }
    .sweep-1 { transform-origin: 150px 140px; animation: tudumBeamSweep 7s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .sweep-2 { transform-origin: 270px 140px; animation: tudumBeamSweep 7s cubic-bezier(0.16, 1, 0.3, 1) 0.14s infinite; }
    .sweep-3 { transform-origin: 380px 140px; animation: tudumBeamSweep 7s cubic-bezier(0.16, 1, 0.3, 1) 0.28s infinite; }
    .anim-nf { transform-origin: 175px 135px; animation: logoNetflixReveal 7s cubic-bezier(0.2, 1, 0.3, 1) infinite; }
    .anim-cross { transform-origin: 270px 134px; animation: sparkCross 7s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .anim-shock { transform-origin: 270px 134px; animation: shockwavePulse 7s ease-out infinite; }
    .anim-il { transform-origin: 360px 135px; animation: logoIlinkReveal 7s cubic-bezier(0.2, 1, 0.3, 1) infinite; }
    .laser-line { stroke-dasharray: 260; animation: scannerLaser 7s ease-in-out infinite; }
    .anim-subtext { transform-origin: 270px 190px; animation: subHeadlineReveal 7s ease-out infinite; }
  </style>

  <defs>
    <!-- Red Room Cinema Crimson Radial Glow -->
    <radialGradient id="rrBackdropGlow" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#BF0712" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="0" />
    </radialGradient>

    <!-- TV Screen Deep Obsidian Surface -->
    <radialGradient id="rrOledSurface" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#1B070B" />
      <stop offset="55%" stop-color="#0E0C10" />
      <stop offset="100%" stop-color="#040406" />
    </radialGradient>

    <!-- Vertical Tudum Light Ribbons -->
    <linearGradient id="rrBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0" />
      <stop offset="35%" stop-color="#E50914" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF3E48" stop-opacity="1" />
      <stop offset="65%" stop-color="#E50914" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0" />
    </linearGradient>

    <!-- Screen Glass Diagonal Highlight -->
    <linearGradient id="rrGlass" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.015" />
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Clip Path for the 16:9 Screen -->
    <clipPath id="rrTvClip">
      <rect x="58" y="32" width="424" height="226" rx="6" />
    </clipPath>
  </defs>

  <!-- 1. Red Room Backdrop: Crimson Stage Circle & Curtains -->
  <g opacity="0.95">
    <circle cx="270" cy="148" r="148" fill="#E50914" fill-opacity="0.9" />
    <circle cx="270" cy="148" r="147" stroke="#723039" stroke-width="1.5" fill="none" />
    <g fill="#BF0712" opacity="0.6">
      <rect x="145" y="10" width="2" height="280" />
      <rect x="175" y="10" width="2" height="280" />
      <rect x="205" y="10" width="2" height="280" />
      <rect x="235" y="10" width="2" height="280" />
      <rect x="265" y="10" width="2" height="280" />
      <rect x="295" y="10" width="2" height="280" />
      <rect x="325" y="10" width="2" height="280" />
      <rect x="355" y="10" width="2" height="280" />
      <rect x="385" y="10" width="2" height="280" />
    </g>
  </g>

  <!-- Ambient Glow Pulse -->
  <ellipse class="glow-pulse" cx="270" cy="148" rx="230" ry="135" fill="url(#rrBackdropGlow)" />

  <!-- Floor Reflection Shadow -->
  <ellipse cx="270" cy="324" rx="185" ry="10" fill="#000000" fill-opacity="0.75" />
  <ellipse cx="270" cy="324" rx="115" ry="5" fill="#E50914" fill-opacity="0.3" />

  <!-- 2. TV Pedestal Stand & Soundbar Console -->
  <rect x="254" y="266" width="32" height="26" rx="2" fill="#18181B" stroke="#353034" stroke-width="1.2" />
  <rect x="165" y="290" width="210" height="13" rx="6.5" fill="#141316" stroke="#353034" stroke-width="1.2" />
  <circle cx="270" cy="296.5" r="2" fill="#E50914" />
  <line x1="185" y1="296.5" x2="255" y2="296.5" stroke="#252328" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="285" y1="296.5" x2="355" y2="296.5" stroke="#252328" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M135 314 L160 305 H380 L405 314 H135 Z" fill="#242125" stroke="#353034" stroke-width="1" />
  <rect x="135" y="314" width="270" height="3" rx="1.5" fill="#F1EEE8" />

  <!-- 3. TV Outer Frame (Ultra-Thin Bezel in Warm Cream & Obsidian) -->
  <rect x="52" y="26" width="436" height="238" rx="8" fill="#050507" />
  <rect x="52" y="26" width="436" height="238" rx="8" fill="#18181B" stroke="#E9E4DD" stroke-width="2" />
  <rect x="58" y="32" width="424" height="226" rx="5" fill="url(#rrOledSurface)" stroke="#353034" stroke-width="1" />

  <!-- TV Power LED -->
  <line x1="56" y1="256" x2="484" y2="256" stroke="#282529" stroke-width="1" />
  <circle cx="270" cy="258" r="1.6" fill="#E50914" />

  <!-- 4. TV SCREEN: ANIMATED MOTION INTRO (NETFLIX x iLINK) -->
  <g clip-path="url(#rrTvClip)">
    <rect x="58" y="32" width="424" height="18" fill="#030305" opacity="0.85" />
    <rect x="58" y="240" width="424" height="18" fill="#030305" opacity="0.85" />

    <g opacity="0.75">
      <circle cx="75" cy="41" r="2.8" fill="#E50914" />
      <text x="83" y="44" fill="#AAA3A0" font-family="Arial, sans-serif" font-size="7" font-weight="700" letter-spacing="1.8">NETFLIX ACCESS • 4K HDR</text>
      <text x="428" y="44" fill="#88817E" font-family="Arial, sans-serif" font-size="7" font-weight="700" letter-spacing="1.2">DOLBY 5.1</text>
    </g>

    <g class="sweep-1">
      <rect x="120" y="36" width="3.5" height="215" fill="url(#rrBeam)" opacity="0.6" />
      <rect x="140" y="36" width="10" height="215" fill="url(#rrBeam)" opacity="0.35" />
      <rect x="175" y="36" width="2" height="215" fill="url(#rrBeam)" opacity="0.8" />
    </g>
    <g class="sweep-2">
      <rect x="245" y="36" width="2.5" height="215" fill="url(#rrBeam)" opacity="0.7" />
      <rect x="268" y="36" width="14" height="215" fill="url(#rrBeam)" opacity="0.4" />
      <rect x="295" y="36" width="3" height="215" fill="url(#rrBeam)" opacity="0.65" />
    </g>
    <g class="sweep-3">
      <rect x="360" y="36" width="8" height="215" fill="url(#rrBeam)" opacity="0.4" />
      <rect x="390" y="36" width="3" height="215" fill="url(#rrBeam)" opacity="0.75" />
    </g>

    <circle class="anim-shock" cx="270" cy="134" r="32" stroke="#E50914" stroke-width="2" fill="none" />

    <!-- [LEFT] NETFLIX Logo + Ribbon Badge -->
    <g class="anim-nf">
      <rect x="94" y="110" width="30" height="44" rx="4" fill="#140709" stroke="#E50914" stroke-width="1.4" />
      <rect x="101" y="117" width="5" height="30" fill="#B30710" />
      <rect x="112" y="117" width="5" height="30" fill="#B30710" />
      <polygon points="101,117 106,117 117,147 112,147" fill="#E50914" />

      <text x="132" y="139" fill="#E50914" font-family="Arial Black, Impact, Arial, sans-serif" font-size="23" font-weight="900" letter-spacing="1.4">NETFLIX</text>
      <text x="133" y="150" fill="#AAA3A0" font-family="Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="2.2">STREAM ACCESS</text>
    </g>

    <!-- [CENTER] Collaboration '×' Spark -->
    <g class="anim-cross">
      <circle cx="270" cy="134" r="14" fill="#181417" stroke="#E50914" stroke-width="1.5" />
      <path d="M265 129 L275 139 M275 129 L265 139" stroke="#F1EEE8" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- [RIGHT] iLINK Brand -->
    <g class="anim-il">
      <rect x="296" y="110" width="148" height="44" rx="5" fill="#F1EEE8" />
      <polygon points="312,144 318,118 326,118 320,144" fill="#E50914" />
      <text x="331" y="140" fill="#171719" font-family="Arial Black, Arial, sans-serif" font-size="23" font-weight="900" letter-spacing="-0.8">iLINK</text>
      <text x="332" y="150" fill="#66615D" font-family="Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.8">NETFLIX ACCESS</text>
    </g>

    <!-- Laser Line & Subtitle -->
    <g class="anim-subtext">
      <line x1="150" y1="172" x2="390" y2="172" stroke="#262225" stroke-width="2" stroke-linecap="round" />
      <line class="laser-line" x1="150" y1="172" x2="390" y2="172" stroke="#E50914" stroke-width="2.5" stroke-linecap="round" />

      <rect x="175" y="182" width="190" height="20" rx="4" fill="#161519" stroke="#353034" stroke-width="1" />
      <text x="187" y="195" fill="#F1EEE8" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.4">SATU AKSES. BANYAK LAYAR.</text>
    </g>

    <path d="M58 32 H280 L160 258 H58 V32 Z" fill="url(#rrGlass)" pointer-events="none" />
  </g>

  <!-- 5. Floating Cinema Admission Ticket -->
  <g transform="translate(366, 230) rotate(-6)">
    <rect x="2" y="4" width="144" height="64" rx="4" fill="#000000" fill-opacity="0.6" />
    <rect x="0" y="0" width="144" height="64" rx="4" fill="#F1EEE8" stroke="#18181B" stroke-width="1.5" />
    <rect x="0" y="0" width="7" height="64" rx="2" fill="#E50914" />
    <text x="16" y="17" fill="#66615D" font-family="Arial, sans-serif" font-size="7" font-weight="700" letter-spacing="1.4">TONIGHT'S PLAN</text>
    <text x="16" y="36" fill="#171719" font-family="Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="-0.5">JUST PLAY.</text>
    <g fill="#201B1E" transform="translate(16, 43)">
      <rect x="0" y="0" width="2.5" height="11" />
      <rect x="5" y="0" width="1.5" height="11" />
      <rect x="9" y="0" width="3" height="11" />
      <rect x="15" y="0" width="1.5" height="11" />
      <rect x="19" y="0" width="4" height="11" />
      <rect x="26" y="0" width="1.5" height="11" />
      <rect x="31" y="0" width="2.5" height="11" />
      <rect x="36" y="0" width="2" height="11" />
      <rect x="41" y="0" width="4" height="11" />
      <rect x="48" y="0" width="1.5" height="11" />
      <rect x="53" y="0" width="3" height="11" />
      <rect x="59" y="0" width="1.5" height="11" />
      <rect x="64" y="0" width="3" height="11" />
    </g>
    <circle cx="122" cy="32" r="11" fill="#E50914" />
    <polygon points="119,27 119,37 128,32" fill="#F1EEE8" />
  </g>

  <!-- 6. Remote Control -->
  <g transform="translate(24, 218) rotate(10)">
    <rect x="2" y="3" width="36" height="82" rx="6" fill="#000000" fill-opacity="0.5" />
    <rect x="0" y="0" width="36" height="82" rx="6" fill="#18181B" stroke="#E9E4DD" stroke-width="1.5" />
    <circle cx="18" cy="12" r="3.2" fill="#E50914" />
    <circle cx="18" cy="32" r="10" fill="#121114" stroke="#464144" stroke-width="1" />
    <circle cx="18" cy="32" r="4" fill="#2E2B2F" />
    <rect x="8" y="48" width="20" height="7" rx="2" fill="#E50914" />
    <rect x="8" y="60" width="8" height="12" rx="2" fill="#2C292D" />
    <rect x="20" y="60" width="8" height="12" rx="2" fill="#2C292D" />
  </g>
</svg>
